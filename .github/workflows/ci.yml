name: CI

# Run on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository.
permissions:
  contents: read

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA; the tag is kept in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Use the Go version declared in go.mod, so CI and local builds match.
          go-version-file: go.mod

      # gofmt exits 0 even when files need formatting, so fail on any output.
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
